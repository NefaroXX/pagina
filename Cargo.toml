[package]
name = "pagina"
version = "0.1.0"
edition = "2021"
description = "Bidirectional Markdown ↔ HTML converter"
license = "MIT"
repository = "https://github.com/NefaroXX/pagina"
keywords = ["markdown", "html", "converter", "cli", "bidirectional"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = [".github/", ".gitignore", "target/", ".deepwork/"]

[[bin]]
name = "pagina"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
